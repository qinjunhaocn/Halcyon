name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Halcyon
        uses: actions/checkout@v4

      - name: Check application license provenance
        run: python3 tools/check_licenses.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          if ! sdkmanager --channel=3 "platforms;android-37"; then
            echo "platforms;android-37 is unavailable from sdkmanager; using android-36 as a CI compatibility platform."
            sdkmanager "platforms;android-36"
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -a "$ANDROID_HOME/platforms/android-36/." "$ANDROID_HOME/platforms/android-37/"
            sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
          fi
          sdkmanager --channel=3 "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build pinned miuix snapshot dependency
        run: |
          set -euo pipefail
          rm -rf ../miuix
          git clone --filter=blob:none https://github.com/compose-miuix-ui/miuix.git ../miuix
          cd ../miuix
          git checkout -q ac0af467
          # repo1.maven.org and the plugin portal are not always reachable from the runner.
          sed -i 's|mavenCentral()|maven("https://repo.maven.apache.org/maven2")|g' settings.gradle.kts
          sed -i 's|gradlePluginPortal()|gradlePluginPortal()\n        maven("https://maven.aliyun.com/repository/gradle-plugin")|g' settings.gradle.kts
          sed -i 's|google {|maven("https://maven.aliyun.com/repository/google")\n        google {|g' settings.gradle.kts
          sed -i 's|mavenCentral()|maven("https://repo.maven.apache.org/maven2")|g' build-logic/settings.gradle.kts
          ./gradlew --no-daemon \
            :miuix-core:publishAllPublicationsToLocalRepository \
            :miuix-ui:publishAllPublicationsToLocalRepository \
            :miuix-preference:publishAllPublicationsToLocalRepository \
            :miuix-material:publishAllPublicationsToLocalRepository \
            :miuix-blur:publishAllPublicationsToLocalRepository \
            :miuix-glass:publishAllPublicationsToLocalRepository \
            :miuix-glass-icons:publishAllPublicationsToLocalRepository \
            :miuix-squircle:publishAllPublicationsToLocalRepository \
            :miuix-icons:publishAllPublicationsToLocalRepository
          ls ../miuix/miuix-core/build/repository/local

      - name: Diagnose dependency repositories
        run: |
          for u in \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.9/asm-9.9.pom \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/compose-compiler-gradle-plugin/2.4.20/compose-compiler-gradle-plugin-2.4.20.pom \
            https://maven.aliyun.com/repository/public/org/ow2/asm/asm/9.9/asm-9.9.pom \
            https://maven.aliyun.com/repository/gradle-plugin/org/jetbrains/kotlin/compose-compiler-gradle-plugin/2.4.20/compose-compiler-gradle-plugin-2.4.20.pom \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.4.1/gradle-9.4.1.pom ; do
            echo -n "$u -> "
            curl -s -o /dev/null -w "%{http_code}\n" -m 25 "$u" || echo "curl-failed"
          done

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew --no-daemon :app:assembleDebug -PellaAbi=arm64-v8a --stacktrace

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ALLOW_DEBUG_SIGNED_RELEASE: "true"
        run: ./gradlew --no-daemon :app:assembleRelease -PellaAbi=arm64-v8a --stacktrace

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;
          find app/build/outputs/renamed-apk -type f -name "*.APK" -print -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-arm64-v8a-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/release/*arm64-v8a*.apk
            app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
            app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
          if-no-files-found: error
